<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Comparator</title><link rel="stylesheet" href="compare.css"></head>
<body><main><h1>Open-Access Paper Comparator</h1><p class="intro">Choose renowned sources. The extension automatically retrieves only legally available open-access full text into temporary memory; it does not save papers in Downloads or the project folder.</p><fieldset id="sources"><legend>Search sources</legend><label><input type="checkbox" value="IEEE" checked> IEEE</label><label><input type="checkbox" value="Springer" checked> Springer</label><label><input type="checkbox" value="PLOS" checked> PLOS</label><label><input type="checkbox" value="Frontiers" checked> Frontiers</label><label><input type="checkbox" value="MDPI" checked> MDPI</label></fieldset><form id="search-form"><input id="topic" required placeholder="Research topic"><button>Find 5 new papers</button></form><div class="row"><input id="doi" placeholder="Add an open-access DOI"><button id="add-doi" type="button">Add DOI</button><button id="reset" type="button">Reset this topic</button></div><p id="status" role="status"></p><section id="papers"></section><button id="compare" type="button" class="primary">Automatically compare selected papers</button><section id="results"></section></main><script src="compare.js"></script></body></html>
